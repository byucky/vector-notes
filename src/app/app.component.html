<main class="main-container">
  <app-header />
  <mat-sidenav-container class="notes-container">
    <mat-sidenav mode="side" opened class="notes-navigator">
      <notes-navigator />
    </mat-sidenav>
    <mat-sidenav-content class="note-editor">
      <search-results *ngIf="hasSearchResults(); else noteEditor"></search-results>
      <ng-template #noteEditor>
        <note-editor></note-editor>
      </ng-template>
    </mat-sidenav-content>
  </mat-sidenav-container>
</main>

<router-outlet />
